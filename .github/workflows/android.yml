name: Android

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        run: chmod +x gradlew
        working-directory: android

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
        working-directory: android

